common_cfg:
  embed_dim: 64 
  activation: relu  

encoder_cfg:
  gnn_cfg:
    op_dim: 11          # normalized operation state + explicit real/ghost presence bit
    site_dim: 22        # [Occ, Interf, Rem_time, X, Y] + job compatibility mask
    dev_dim: 5          # 设备节点特征维度 [Type, Status, Rem_time, Pos_X, Pos_Y]
    req_dim: 8          # 请求节点特征维度 [ReqType, Wait, SiteX, SiteY, SiteIdx, JobIdx, PlaneIdx, IsNoop]
    global_feature_dim: 24  # normalized F1 workload/arrival + F2 resource summaries
    edge_dim: 1         # 边特征维度 (距离或时间预测)
    
    embedding_layer: 2  # Embedding_layer 的 MLP 层数
    layer_num: 4        # 异构图卷积层数 (建议4层，太深容易过平滑)
    nhead: 4            # TransformerConv 的多头注意力头数
    dropout: 0.1        # 防止过拟合的 Dropout 率

  gff_cfg:
    layer: 2

sel_encoder_cfg:
  input_dim: 64

actor_cfg:
  query_dim: 192  
  nhead: 4 
  pair_feature_dim: 10

critic_cfg:
  query_dim: 192  
  nhead: 4
