schema_version: 1
scope: stage1_plane_policy
environment_adapter: HKBZ-AT

fair_comparison_contract:
  training_stage: plane_pretrain
  resource_policy: heuristic
  resource_dispatcher: hungarian
  plane_order_mode: fixed
  action_mask_source: environment
  pair_feature_storage: sparse_legal
  checkpoint_selection_split: validation
  test_checkpoint_selection: forbidden
  equalized_budget: environment_interactions
  minimum_seeds: 3

methods:
  l2d:
    paper_name: L2D
    experiment_name: L2D-AT
    encoder: operation_only_gin
    operation_features:
      - scheduled_indicator
      - precedence_completion_lower_bound
    action: ppo_operation_then_earliest_feasible_completion_site
    mobile_resource_nodes_visible: false

  multi_ppo:
    paper_name: Multi-PPO
    experiment_name: Multi-PPO-AT
    encoder: operation_gin_plus_site_mlp
    action: operation_policy_then_conditional_site_policy
    mobile_resource_nodes_visible: false

  fjsp_drl:
    paper_name: FJSP-DRL
    experiment_name: FJSP-DRL-AT
    encoder: operation_site_hgnn
    action: legal_operation_site_pair
    mobile_resource_nodes_visible: false

  daniel:
    paper_name: DANIEL
    experiment_name: DANIEL-AT
    encoder: dual_operation_site_attention
    action: legal_operation_site_pair_with_eight_pair_attributes
    mobile_resource_nodes_visible: false

