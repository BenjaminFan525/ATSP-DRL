name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install smoke-test dependencies
        run: python -m pip install pytest PyYAML matplotlib
      - name: Compile Python sources
        run: python -m compileall -q onpolicy tests
      - name: Run repository tests
        env:
          MPLBACKEND: Agg
        run: pytest -q
